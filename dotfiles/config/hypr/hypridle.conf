
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Nothing happens on its own when the PC is left alone: no automatic lock, the
# screens stay on, and it does not go to sleep. Locking (SUPER + L) and sleep
# (power menu) are still there to use by hand, and a manual sleep still locks
# first because of the `general` block above.
#
# To bring automatic behaviour back, add listeners like these (times are in
# seconds without touching the keyboard or mouse):
#
#   listener {
#       timeout = 300
#       on-timeout = hyprlock
#   }
#   listener {
#       timeout = 600
#       on-timeout = hyprctl dispatch dpms off
#       on-resume = hyprctl dispatch dpms on
#   }
#   listener {
#       timeout = 1800
#       on-timeout = systemctl suspend
#   }
