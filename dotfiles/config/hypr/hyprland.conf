
$mod = SUPER

env = XCURSOR_THEME,Colloid-dark-cursors
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = QT_AUTO_SCREEN_SCALE_FACTOR,0

# This machine's own monitor rules, from pwnbox.desktop.monitors in
# hosts/<host>/default.nix (nothing is written here on a one-screen machine).
@MONITORS@
# Every other monitor.
monitor = , @RESOLUTION@, auto, 1

exec-once = swaybg -i ~/.config/hypr/wall.png -m fill
exec-once = sh -c 'sleep 1; ~/.scripts/pwnbox-theme restore'
exec-once = hypridle
exec-once = hyprpolkitagent
# Microphone effects (EasyEffects): started in the background with no window,
# and the microphone gate is loaded if it is not already on (see the script).
exec-once = ~/.scripts/pwnbox-easyeffects
exec-once = qs -n
# The Alt+Tab switcher. A second Quickshell instance, kept
# apart from the bar so a problem there cannot take the bar down with it.
exec-once = qs -n -p @HOME@/.config/quickshell-overlays
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(a4a4a4ff)
    col.inactive_border = rgba(252525ff)
    layout = dwindle
    resize_on_border = false
    allow_tearing = false
}

decoration {
    rounding = 9
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 13
        render_power = 3
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = true
    }
}

layerrule = blur on, ignore_alpha 0.5, match:namespace quickshell
layerrule = blur on, ignore_alpha 0.5, match:namespace rofi
# The Alt+Tab switcher animates itself, so Hyprland's own layer fade is off for
# it. Its panel gets the same background blur as the bar's panels.
layerrule = no_anim on, match:namespace ^(pwnbox-switcher)$
layerrule = blur on, ignore_alpha 0.5, match:namespace pwnbox-switcher

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, easeOut
    animation = windowsOut, 1, 4, easeOut, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, easeOut, slide

    animation = layers, 1, 3, easeOut, fade
    animation = layersOut, 1, 2, easeOut, fade
}

dwindle {
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

cursor {
    no_hardware_cursors = true
}

input {
    kb_layout = se
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

# New windows open tiled instead of maximized. Fullscreen is deliberately not
# suppressed: a video's own fullscreen button (YouTube, Twitch ...) asks for it,
# and ignoring that request made fullscreen work only after SUPER + F.
windowrule {
    name = tile-on-open
    match:class = .*
    suppress_event = maximize
}

bind = CTRL, Return, exec, kitty
bind = ALT, D, exec, equibop
bind = ALT, F, exec, zen
bind = ALT, M, exec, kitty cmus
# Cutter and Session: the AppImage in ~/Documents/AppImages if there is one,
# otherwise the installed program (so the keys also work on a fresh machine).
bind = ALT, C, exec, sh -c 'a=$(ls "$HOME"/Documents/AppImages/Cutter*.AppImage 2>/dev/null | head -1); [ -n "$a" ] && exec "$a"; exec cutter'
bind = ALT, 0, exec, sh -c 'a=$(ls "$HOME"/Documents/AppImages/session*.AppImage 2>/dev/null | head -1); [ -n "$a" ] && exec "$a"; exec session-desktop'
bind = SUPER, E, exec, nautilus
bind = SUPER, W, exec, sh -c 'export EDITOR=micro MICRO_TRUECOLOR=1 && kitty ranger'
bind = CTRL, SPACE, exec, rofi -show drun
bind = ALT, E, exec, ~/.scripts/emojipick
# Alt+Tab: hold ALT and tap TAB to step through window previews, most recent
# first; add SHIFT to go back; let go of ALT to switch. The last two binds tell
# the switcher that ALT was released, in case it has not got the keyboard yet.
bind = ALT, Tab, global, pwnbox:switcher-next
bind = ALT SHIFT, Tab, global, pwnbox:switcher-previous
bindrn = ALT, Alt_L, global, pwnbox:switcher-release
bindrn = ALT SHIFT, Alt_L, global, pwnbox:switcher-release

bind = SUPER SHIFT, S, exec, ~/.scripts/pwnbox-screenshot clipboard
bind = ALT, S, exec, ~/.scripts/pwnbox-theme menu

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ALT + Z closes the window; ALT + SHIFT + Q ends the program (see pwnbox-quit).
bind = ALT, Z, killactive
bind = ALT SHIFT, Q, exec, ~/.scripts/pwnbox-quit
bind = SUPER ALT, Q, exit
bind = SUPER ALT, R, exec, hyprctl reload
bind = SUPER, V, layoutmsg, togglesplit
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, fullscreen, 1
bind = SUPER, T, togglefloating
bind = SUPER, P, pseudo

bind = SUPER CTRL, 1, layoutmsg, splitratio 0.1
bind = SUPER CTRL, 2, layoutmsg, splitratio 0.2
bind = SUPER CTRL, 3, layoutmsg, splitratio 0.3
bind = SUPER CTRL, 4, layoutmsg, splitratio 0.4
bind = SUPER CTRL, 5, layoutmsg, splitratio 0.5
bind = SUPER CTRL, 6, layoutmsg, splitratio 0.6
bind = SUPER CTRL, 7, layoutmsg, splitratio 0.7
bind = SUPER CTRL, 8, layoutmsg, splitratio 0.8
bind = SUPER CTRL, 9, layoutmsg, splitratio 0.9

bind = ALT, Left, movefocus, l
bind = ALT, Right, movefocus, r
bind = ALT, Up, movefocus, u
bind = ALT, Down, movefocus, d
bind = ALT SHIFT, Left, movewindow, l
bind = ALT SHIFT, Right, movewindow, r
bind = ALT SHIFT, Up, movewindow, u
bind = ALT SHIFT, Down, movewindow, d

bind = SUPER CTRL, Left, resizeactive, -40 0
bind = SUPER CTRL, Right, resizeactive, 40 0
bind = SUPER CTRL, Up, resizeactive, 0 -40
bind = SUPER CTRL, Down, resizeactive, 0 40
bind = SUPER ALT, Left, resizeactive, 40 0
bind = SUPER ALT, Right, resizeactive, -40 0
bind = SUPER ALT, Up, resizeactive, 0 40
bind = SUPER ALT, Down, resizeactive, 0 -40

bind = SUPER SHIFT, Left, moveactive, -40 0
bind = SUPER SHIFT, Right, moveactive, 40 0
bind = SUPER SHIFT, Up, moveactive, 0 -40
bind = SUPER SHIFT, Down, moveactive, 0 40

bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6
bind = ALT, 7, workspace, 7
bind = ALT, 8, workspace, 8
bind = ALT, 9, workspace, 9
bind = SUPER, 1, movetoworkspace, 1
bind = SUPER, 2, movetoworkspace, 2
bind = SUPER, 3, movetoworkspace, 3
bind = SUPER, 4, movetoworkspace, 4
bind = SUPER, 5, movetoworkspace, 5
bind = SUPER, 6, movetoworkspace, 6
bind = SUPER, 7, movetoworkspace, 7
bind = SUPER, 8, movetoworkspace, 8
bind = SUPER, 9, movetoworkspace, 9

bind = CTRL ALT, Left, workspace, e-1
bind = CTRL ALT, Right, workspace, e+1
bind = CTRL ALT, tab, workspace, previous

bind = SUPER, L, exec, hyprlock
bind = SUPER, ESCAPE, exec, sh -c 'qs ipc call powermenu toggle || wlogout'
bind = SUPER, grave, exec, sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'
bind = , Print, exec, hyprshot -m output
bind = SUPER SHIFT, R, exec, ~/.scripts/pwnbox-screenshot save

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

source = @HOME@/.cache/pwnbox/theme/hyprland.conf
