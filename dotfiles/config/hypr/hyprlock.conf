# The lock screen. Its wallpaper, colours, font and corner radius come from the
# current theme: pwnbox-theme writes them to the file below every time the
# theme, the wallpaper or the fonts change.
source = ~/.cache/pwnbox/theme/hyprlock.conf

background {
    monitor =
    path = $lock_wallpaper
    blur_passes = 2
    color = $lock_bg
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = $lock_rounding
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    outer_color = $lock_outline
    inner_color = $lock_field
    font_color = $lock_fg
    check_color = $lock_dim
    fail_color = $lock_outline
    font_family = $lock_font
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $lock_fg
    font_size = 56
    font_family = $lock_font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $lock_dim
    font_size = 16
    font_family = $lock_font
    position = 0, 70
    halign = center
    valign = center
}
