# Settings for the screen-sharing portal (xdg-desktop-portal-hyprland), which is
# what Discord, browsers and OBS use to capture the screen on Wayland.
#
# It is read when the portal starts. After changing it, run:
#   systemctl --user restart xdg-desktop-portal-hyprland
screencopy {
    # Capture at most 60 frames per second. DP-2 runs at 164.5 Hz, but Discord
    # sends at most 60 fps, so capturing at the monitor's full rate only makes
    # frames arrive unevenly, which looks like tearing and stutter on the stream.
    max_fps = 60

    # Copy each frame through ordinary memory instead of handing Discord/OBS the
    # graphics card's own buffer. On NVIDIA the direct hand-over has no
    # synchronisation, so the recorder can read a frame while Hyprland is still
    # drawing it; that shows as torn or half-updated frames, worst when a lot
    # redraws at once (opening the ALT + S menu, Alt+Tab, a blurred
    # panel). It costs a little CPU. To go back, put a # in front of the line.
    force_shm = true
}
